# docker-compose.yml — optional full data-warehouse stack
#
# Brings up:
#   - PostgreSQL      (metastore for Hive / Airflow)
#   - HDFS            (NameNode + DataNode)
#   - Hive            (metastore + hiveserver2)
#   - Spark           (master + worker)
#   - Kafka           (broker + UI)
#   - Flink           (jobmanager + taskmanager)
#   - Trino           (query engine)
#   - ClickHouse      (OLAP)
#   - Apache Doris    (OLAP)
#   - MinIO           (S3-compatible object store for Iceberg)
#   - Airflow         (scheduler + webserver)
#   - Jupyter         (notebook IDE)
#
# Start the full stack:
#   docker compose up -d
# Start a subset:
#   docker compose up -d postgres minio spark-master spark-worker
#
# UIs:
#   - Airflow:        http://localhost:8080   (admin / admin)
#   - Spark:          http://localhost:8081
#   - Flink:          http://localhost:8082
#   - Trino:          http://localhost:8083
#   - Kafka UI:       http://localhost:8084
#   - MinIO:          http://localhost:9001   (minio / minio123)
#   - Jupyter:        http://localhost:8888   (token: datawarehouse)
#   - HDFS:           http://localhost:9870

version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  namenode:
    image: apache/hadoop:3.3.6
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports: ["9870:9870", "9000:9000"]
    volumes: [hdfsname:/tmp/hadoop-root/dfs/name]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  datanode:
    image: apache/hadoop:3.3.6
    command: ["hdfs", "datanode"]
    ports: ["9864:9864"]
    volumes: [hdfsdata:/tmp/hadoop-root/dfs/data]
    depends_on:
      namenode: { condition: service_healthy }

  hive-metastore:
    image: apache/hive:3.1.3
    command: /opt/hive/bin/hive --service metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
    ports: ["9083:9083"]
    depends_on:
      postgres: { condition: service_healthy }

  hive-server:
    image: apache/hive:3.1.3
    command: /opt/hive/bin/hive --service hiveserver2
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_SERVER2_THRIFT_PORT: 10000
      HIVE_SERVER2_WEBUI_PORT: 10002
    ports: ["10000:10000", "10002:10002"]
    depends_on:
      hive-metastore: { condition: service_started }
      postgres: { condition: service_healthy }

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
      SPARK_DAEMON_JAVA_OPTS: "-Xmx2g"
    ports: ["8081:8080", "7077:7077"]
    volumes:
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro

  spark-worker:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: "2g"
      SPARK_WORKER_CORES: "2"
    depends_on: [spark-master]
    volumes:
      - ./spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro

  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    volumes: [kafkadata:/bitnami/kafka]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8084:8080"]
    depends_on: [kafka]

  flink-jobmanager:
    image: flink:1.18
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink/checkpoints
    ports: ["8082:8081"]
    volumes: [flinkstate:/tmp/flink]

  flink-taskmanager:
    image: flink:1.18
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: "4"
        state.backend: rocksdb
    depends_on: [flink-jobmanager]
    volumes: [flinkstate:/tmp/flink]

  trino:
    image: trinodb/trino:435
    ports: ["8083:8080"]
    volumes:
      - ./trino-conf:/etc/trino:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports: ["8123:8123", "9000:9000"]
    volumes: [chdata:/var/lib/clickhouse]

  doris-fe:
    image: apache/doris:2.0.2-fe
    ports: ["9030:9030", "8030:8030"]
    volumes: [dorisfe:/opt/apache-doris/fe/doris-meta]

  doris-be:
    image: apache/doris:2.0.2-be
    ports: ["8040:8040"]
    depends_on: [doris-fe]
    volumes: [dorisbe:/opt/apache-doris/be/storage]

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    depends_on:
      postgres: { condition: service_healthy }

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  jupyter:
    image: jupyter/datascience-notebook:latest
    environment:
      JUPYTER_TOKEN: datawarehouse
    ports: ["8888:8888"]
    volumes:
      - ../:/home/jovyan/work:rw

volumes:
  pgdata:
  miniodata:
  hdfsname:
  hdfsdata:
  kafkadata:
  flinkstate:
  chdata:
  dorisfe:
  dorisbe:
