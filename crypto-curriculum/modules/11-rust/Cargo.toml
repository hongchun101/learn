[package]
name = "crypto-curriculum-rust"
version = "0.1.0"
edition = "2021"
description = "From-0-to-expert cryptography curriculum: Rust primitives"

[lib]
path = "src/lib.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.2"
hex = "0.4"

[dev-dependencies]
# 使用 Rust 内置的测试框架；无需额外的测试依赖。

[features]
# 可选的 AES-GCM 支持；通过 `cargo test --features aes` 启用。
default = []
aes = []
