# logstash/nginx-to-es.conf — 第 17 章 Logstash pipeline
# 把 nginx access log 灌到 ES 日志 data stream
input {
  file {
    path  => "/var/log/nginx/access.log"
    start_position => "beginning"
    sincedb_path   => "/var/lib/logstash/sincedb_nginx"
    codec => "json"
  }
}

filter {
  if [http_user_agent] {
    useragent {
      source       => "http_user_agent"
      target       => "ua"
      remove_field => [ "http_user_agent" ]
    }
  }
  if [request] {
    grok {
      match => { "request" => "%{WORD:method} %{URIPATHPARAM:url} HTTP/%{NUMBER:http_version}" }
    }
  }
  geoip {
    source => "remote_addr"
    target => "geoip"
  }
  date {
    match  => [ "[nginx][access][time]", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://es:9200"]
    data_stream => true
    data_stream_type => "logs"
    data_stream_dataset => "nginx.access"
  }
}
