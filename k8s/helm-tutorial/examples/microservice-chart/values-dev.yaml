# 开发环境:小、简单、暴露多
replicaCount: 1

image:
  repository: myorg/microservice
  tag: "dev-latest"
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: dev.microservice.local
      paths:
        - path: /
          pathType: Prefix

config:
  logLevel: debug
  env: development
  features:
    hotReload: true
    debugRoutes: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podDisruptionBudget:
  enabled: false
